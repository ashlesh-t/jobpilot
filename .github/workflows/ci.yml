name: CI

# Runs on every push to main/development and on every PR into them.
# Two guarantees:
#   1. the test suite passes on Linux + macOS (POSIX — the pipeline uses /tmp paths)
#   2. the package builds and the `jobpilot` CLI works on Linux + macOS + Windows
#      (this is what the v1.6.0 cross-platform install promises)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Full test suite (POSIX) ---------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (core + server + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-server.txt
      - name: Byte-compile
        run: python -m compileall -q jobpilot core orchestrator scripts engines server tests
      - name: Validate plugin manifests are valid JSON
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); print('manifests OK')"
      - name: Run tests
        run: pytest -q

  # ---- Packaging smoke test (Linux + macOS + Windows) ----------------------
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI
        shell: bash
        run: |
          if [ -f ui/package.json ]; then
            npm --prefix ui ci
            npm --prefix ui run build
          else
            echo "ui/package.json not present yet — skipping the UI build"
          fi
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the built wheel (core deps only)
        shell: bash
        run: pip install dist/*.whl
      # The UI is shipped inside the wheel so a pipx install needs no Node toolchain.
      # If this asset is missing, `jobpilot start` serves a blank page — fail loudly here.
      - name: Assert the UI is bundled in the wheel
        shell: bash
        run: |
          if [ -f ui/package.json ]; then
            python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if "jobpilot/bundle/ui_dist/index.html" not in names:
              sys.exit(f"ui_dist/index.html missing from {wheel}")
          print("UI bundled OK")
          PY
          fi
      - name: Smoke-test the jobpilot CLI
        shell: bash
        run: |
          set -e
          jobpilot --version
          jobpilot setup --non-interactive
          # `doctor` exits non-zero when checks fail, which is correct — and on a bare
          # runner with no resume, profile or AI backend, failing checks are the right
          # answer. What we're asserting here is that the command runs and reports.
          jobpilot doctor > doctor.txt || true
          cat doctor.txt
          grep -q "Database" doctor.txt
