name: Release to PyPI

# Publishes the sdist + wheel to PyPI when you push a version tag (e.g. v1.6.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token to store. Configure the publisher
# once at https://pypi.org/manage/project/claude-jobpilot/settings/publishing/ :
#   owner: ashlesh-t, repo: jobpilot, workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
